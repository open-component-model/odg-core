[build-system]
requires = ["setuptools", "semver"]
build-backend = "setuptools.build_meta"

[project]
name = "odg-core-libs"
description = "Mandatory system internals for the Open Delivery Gear"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "bdba-client",
    "odg-client",
    "aiohttp",
    "aiohttp-swagger3",
    "awesomeversion",
    "boto3",
    "brotli",
    "cachetools",
    "cyclonedx-python-lib",
    "dacite",
    "dataclasses-json",
    "gardener-cicd-libs",
    "github3.py",
    "htmllistparse",
    "jsonpath-ng",
    "jsonschema",
    "kubernetes",
    "prometheus_client",
    "psycopg[binary]",
    "pyjwt",
    "requests",
    "sqlalchemy>1.4.0",
    "starlette",
    "urllib3",
    "uvicorn",
    "watchdog",
    "python-dateutil",
]

[tool.uv.workspace]
members = ["packages/bdba-client", "packages/odg-client"]

[tool.uv.sources]
bdba-client = { workspace = true }
odg-client = { workspace = true }

[dependency-groups]
dev = [
    "aiohttp-devtools",
    "aiosqlite",
    "greenlet",
    "numpy",
    "pytest<9.1",
    "pytest-asyncio",
    "scipy",
    "ruff",
    "bandit",
    "semver",
    "setuptools",
]

[tool.bandit]
exclude_dirs = ['test', '.venv']
skips = [
  'B104', # we intendedly bind to `0.0.0.0` in productive environments only
  'B105', # we do not hardcode passwords
  'B202', # false-positive: we do pass a filter to tar.extractall
  'B301', # we do not use pickle for untrusted inputs
  'B311', # we know when not to use pseudo-random number generators
  'B403', # we do not use pickle for untrusted inputs
  'B404', # we know how to call subprocesses
  'B413', # false-positive: we do not use pyCrypto, but pycryptodome
  'B603', # we know how to call subprocesses
]

[tool.ruff]
line-length = 101 # be consistent with cc-utils

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
docstring-code-format = true
line-ending = 'lf'
skip-magic-trailing-comma = false # allow one parameter per line

[tool.ruff.lint]
preview = true
select = [
  'COM812',
  'E101',
  'E117',
  'E201',
  'E202',
  'E203',
  'E225',
  'E251',
  'E3',
  'E4',
  'E5',
  'E701',
  'E703',
  'E711',
  'E713',
  'E714',
  'E721',
  'E741',
  'E9',
  'W1',
  'W2',
  'W3',
  'W6',
  'F',
]

ignore = ['F722', 'F821']
