[build-system]
requires = ["setuptools==84.0.0", "semver==3.0.4"]
build-backend = "setuptools.build_meta"

[project]
name = "odg-core-libs"
description = "Mandatory system internals for the Open Delivery Gear"
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    # bdba-client and odg-client are uv workspace members (versions in
    # packages/*/pyproject.toml, wired below via [tool.uv.sources]) — do not
    # pin them here; renovate ignores them (see .github/renovate.json5).
    "bdba-client",
    "odg-client",
    "aiohttp==3.14.3",
    "aiohttp-swagger3==0.10.0",
    "awesomeversion==25.8.0",
    "boto3==1.43.70",
    "brotli==1.2.0",
    "cachetools==7.1.7",
    "cyclonedx-python-lib==11.11.2",
    "dacite==1.9.2",
    "dataclasses-json==0.6.7",
    "gardener-cicd-libs==1.2830.0",
    "github3.py==4.0.1",
    "htmllistparse==0.6.1",
    "jsonpath-ng==1.8.0",
    "jsonschema==4.26.0",
    "kubernetes==36.0.3",
    "prometheus_client==0.26.0",
    "psycopg[binary]==3.3.4",
    "pyjwt==2.13.0",
    "requests==2.34.2",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "urllib3==2.7.0",
    "uvicorn==0.52.1",
    "watchdog==6.0.0",
    "python-dateutil==2.9.0.post0",
]

[tool.uv.workspace]
members = ["packages/bdba-client", "packages/odg-client"]

[tool.uv.sources]
bdba-client = { workspace = true }
odg-client = { workspace = true }

[dependency-groups]
dev = [
    "aiohttp-devtools==1.1.2",
    "aiosqlite==0.22.1",
    "greenlet==3.5.5",
    "numpy==2.5.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "scipy==1.18.0",
    "ruff==0.16.2",
    "bandit==1.9.4",
    "semver==3.0.4",
    "setuptools==84.0.0",
]

[tool.bandit]
exclude_dirs = ['test', '.venv']
skips = [
  'B104', # we intendedly bind to `0.0.0.0` in productive environments only
  'B105', # we do not hardcode passwords
  'B202', # false-positive: we do pass a filter to tar.extractall
  'B301', # we do not use pickle for untrusted inputs
  'B311', # we know when not to use pseudo-random number generators
  'B403', # we do not use pickle for untrusted inputs
  'B404', # we know how to call subprocesses
  'B413', # false-positive: we do not use pyCrypto, but pycryptodome
  'B603', # we know how to call subprocesses
]

[tool.ruff]
line-length = 101 # be consistent with cc-utils

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
docstring-code-format = true
line-ending = 'lf'
skip-magic-trailing-comma = false # allow one parameter per line

[tool.ruff.lint]
preview = true
select = [
  'COM812',
  'E101',
  'E117',
  'E201',
  'E202',
  'E203',
  'E225',
  'E251',
  'E3',
  'E4',
  'E5',
  'E701',
  'E703',
  'E711',
  'E713',
  'E714',
  'E721',
  'E741',
  'E9',
  'W1',
  'W2',
  'W3',
  'W6',
  'F',
]

ignore = ['F722', 'F821']
