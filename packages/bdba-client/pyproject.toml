[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["bdba*"]

[project]
name = "bdba-client"
version = "0.15.0"
requires-python = ">=3.14"
dependencies = [
    "cachecontrol==0.14.4",
    "dacite==1.9.2",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
]
