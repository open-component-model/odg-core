[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["bdba*"]

[project]
name = "bdba-client"
version = "0.15.0"
requires-python = ">=3.12"
dependencies = [
    "cachecontrol",
    "dacite",
    "python-dateutil",
    "requests",
]
