[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["bdba*"]

[project]
name = "bdba-client"
# set by release-client-package workflow
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "cachecontrol==0.14.4",
    "dacite==1.9.2",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
]
