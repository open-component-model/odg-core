 [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [project]
  name = "odg-client"
  version = "0.12.0"
  description = "Client library for the Open Delivery Gear"
  readme = "README.md"
  requires-python = ">=3.11"
  dependencies = [
      "dacite",
      "gardener-ocm",
      "pycryptodome",
      "pyjwt",
      "requests",
  ]

  [tool.hatch.build.targets.wheel]
  packages = ["../../src/delivery", "../../src/odg_client"]
