[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["delivery*", "odg_client*"]

[project]
name = "odg-client"
description = "Client library for the Open Delivery Gear"
version = "0.14.0"
requires-python = ">=3.14"
dependencies = [
    "dacite==1.9.2",
    "gardener-ocm==1.2863.0",
    "pycryptodome==3.24.1",
    "pyjwt==2.15.1",
    "requests==2.34.2",
]
