[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "odg-client"
description = "Client library for the Open Delivery Gear"
version = "0.12.0"
requires-python = ">=3.11"
dependencies = [
    "dacite",
    "gardener-ocm",
    "pycryptodome",
    "pyjwt",
    "requests",
]
