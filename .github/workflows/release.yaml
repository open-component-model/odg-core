name: Release (ODG)
on:
  workflow_dispatch:

jobs:
  check-branch:
    runs-on: ubuntu-latest
    name: Verify Release Branch
    permissions: {}
    steps:
      - name: Verify Release Branch
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || ! "$GITHUB_REF_NAME" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release workflow must run on a 'release-<major>.<minor>' branch, got: $GITHUB_REF_NAME"
            echo "Hint: run the 'Prepare Release Candidate' workflow first to create a release branch."
            exit 1
          fi

  build:
    uses: ./.github/workflows/build.yaml
    needs:
      - check-branch
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      mode: release

  release-to-github-and-bump:
    uses: gardener/cc-utils/.github/workflows/release.yaml@v1
    needs:
      - build
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      release-commit-target: branch
      next-version: bump-patch

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PYPI
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve Distribution Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-packages
      - name: Prepare Filesystem
        run: |
          tar xf distribution-packages.tar.gz
          rm -rf dist/blobs.d dist/ocm_resources.yaml
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 # assumes package to be located in `dist/`
