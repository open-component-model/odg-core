name: Build and publish OCI artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Bare semver, no leading 'v' (0.7.0 or 0.7.0-rc.1)
        required: true
        type: string
      publish:
        description: Push images and charts to the registry and create attestations
        required: false
        type: boolean
        default: true
    outputs:
      core-image-digest:
        description: Digest of the published OCI image index
        value: ${{ jobs.collect-image.outputs.core-image-digest }}
      bootstrapping-chart-digest:
        description: Digest of the published bootstrapping Helm chart
        value: ${{ jobs.helm-chart.outputs.bootstrapping-chart-digest }}
      delivery-service-chart-digest:
        description: Digest of the published delivery-service Helm chart
        value: ${{ jobs.helm-chart.outputs.delivery-service-chart-digest }}
      extensions-chart-digest:
        description: Digest of the published extensions Helm chart
        value: ${{ jobs.helm-chart.outputs.extensions-chart-digest }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-core-libs:
    name: Build Python core libs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build wheel
        id: build
        run: |
          set -euo pipefail

          export ODG_CORE_LIBS_VERSION="${{ inputs.version }}"

          uv run python3 setup.py bdist_wheel --dist-dir dist
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-packages
          path: dist/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - build-core-libs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-packages
          path: dist/
      - name: Lint and format
        run: |
          set -euo pipefail

          uv sync --find-links dist
          make lint
          make format

  unittests:
    name: Unittests
    runs-on: ubuntu-latest
    needs:
      - build-core-libs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-packages
          path: dist/
      - name: Run tests
        run: |
          set -euo pipefail

          uv sync --find-links dist
          .ci/smoke-test
          make test

  oci-image:
    name: Build OCI image
    runs-on: ${{ matrix.platform.runner }}
    needs:
      - build-core-libs
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    strategy:
      matrix:
        platform:
          - name: linux/amd64
            runner: ubuntu-latest
            tag-suffix: linux_amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            tag-suffix: linux_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-packages
          path: dist/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Set lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: Dockerfile
          context: .
          build-args: |
            ODG_CORE_LIBS_VERSION=${{ inputs.version }}
          platforms: ${{ matrix.platform.name }}
          push: ${{ inputs.publish }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/images/core:${{ inputs.version }}-${{ matrix.platform.tag-suffix }}

  collect-image:
    name: Build OCI image index
    if: inputs.publish
    runs-on: ubuntu-latest
    needs:
      - oci-image
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      core-image-digest: ${{ steps.manifest.outputs.core-image-digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push image index
        id: manifest
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"
          IMAGE_REF="$REGISTRY/$OWNER/odg/images/core:${{ inputs.version }}"

          docker buildx imagetools create \
            --tag "${IMAGE_REF}" \
            "${IMAGE_REF}-linux_amd64" \
            "${IMAGE_REF}-linux_arm64"

          digest=$(docker buildx imagetools inspect "${IMAGE_REF}" \
            --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')

          echo "core-image-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Sign OCI image (cosign keyless)
        run: |
          cosign sign -y "$REGISTRY/$OWNER/odg/images/core@${{ steps.manifest.outputs.core-image-digest }}"
      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.manifest.outputs.core-image-digest }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/images/core

  helm-chart:
    name: Build Helm chart
    if: inputs.publish
    runs-on: ubuntu-latest
    needs:
      - collect-image
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      bootstrapping-chart-digest: ${{ steps.push.outputs.bootstrapping-chart-digest }}
      delivery-service-chart-digest: ${{ steps.push.outputs.delivery-service-chart-digest }}
      extensions-chart-digest: ${{ steps.push.outputs.extensions-chart-digest }}
    strategy:
      matrix:
        chart:
          - name: bootstrapping
            dir: charts/bootstrapping
          - name: delivery-service
            dir: charts/delivery-service
          - name: extensions
            dir: charts/extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push chart
        id: push
        env:
          VERSION: ${{ inputs.version }}
          CORE_IMAGE_DIGEST: ${{ needs.collect-image.outputs.core-image-digest }}
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          if [[ "${{ matrix.chart.name }}" == "delivery-service" || "${{ matrix.chart.name }}" == "extensions" ]]; then
            values_file="${{ matrix.chart.dir }}/values.yaml"
            repository="$REGISTRY/$OWNER/odg/images/core"
            sed -i "s|repository: null|repository: ${repository}|" "${values_file}"
            sed -i "s|tag: null|tag: ${CORE_IMAGE_DIGEST}|" "${values_file}"
          fi

          helm package ${{ matrix.chart.dir }} --version "${VERSION}" --app-version "${VERSION}"

          output=$(helm push ${{ matrix.chart.name }}-${VERSION}.tgz \
            oci://$REGISTRY/$OWNER/odg/charts)
          echo "${output}"

          digest=$(echo "${output}" | grep '^Digest:' | cut -d' ' -f2)

          echo "${{ matrix.chart.name }}-chart-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "CHART_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Sign Helm chart (cosign keyless)
        run: |
          cosign sign -y "$REGISTRY/$OWNER/odg/charts/${{ matrix.chart.name }}@${{ env.CHART_DIGEST }}"
      - name: Attest Helm chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ env.CHART_DIGEST }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/charts/${{ matrix.chart.name }}
