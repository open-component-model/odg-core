name: Prepare Release Candidate
on:
  workflow_dispatch:
    inputs:
      commit-sha:
        type: string
        required: false
        description: |
          Optional commit SHA to create the release branch from (defaults to HEAD)
      version:
        type: string
        required: false
        description: |
          Optional <major>.<minor> version for the release branch (e.g. 0.1).
          If not set, the version is determined from existing branches/tags.

permissions: {}

jobs:
  prepare-release-candidate:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    environment:
      name: release-branch
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Determine version
        id: version
        if: ${{ inputs.version == '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # prefer highest existing release-<major>.<minor> branch
          branches=$(gh api "/repos/${{ github.repository }}/branches" \
            --paginate --jq '.[].name')
          last_branch=$(printf '%s\n' "$branches" \
            | grep -E '^release-[0-9]+\.[0-9]+$' \
            | sed 's/release-//' \
            | sort -V \
            | tail -1 || true)

          if [[ -n "${last_branch}" ]]; then
            major=$(echo "${last_branch}" | cut -d. -f1)
            minor=$(echo "${last_branch}" | cut -d. -f2)
            version="${major}.$(( minor + 1 ))"
          else
            # fallback: use greatest full-release tag
            last_tag=$(git tag --list "*.*.*" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1 || true)

            if [[ -z "${last_tag}" ]]; then
              version="0.1"
            else
              major=$(echo "${last_tag}" | cut -d. -f1)
              minor=$(echo "${last_tag}" | cut -d. -f2)
              version="${major}.$(( minor + 1 ))"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create release branch
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          VERSION: ${{ inputs.version || steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          target="${COMMIT_SHA:-${GITHUB_SHA}}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/git/refs \
            -f "ref=refs/heads/release-${VERSION}" \
            -f "sha=${target}"

          echo "Created branch release-${VERSION} at ${target}"
