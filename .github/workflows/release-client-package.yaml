name: Release Client Package
on:
  workflow_dispatch:
    inputs:
      client:
        type: choice
        options:
          - bdba
          - odg

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Update Python Package
    permissions:
      id-token: write
    steps:
      - uses: gardener/cc-utils/.github/actions/trusted-checkout@v1
        with:
          token-server: ${{ vars.FEDERATED_GITHUB_ACCESS_TOKEN_SERVER }}
          github-auth-token-permissions: |
            contents: write
          init-git-identity: true
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Create Distribution Package
        shell: bash
        run: |
          set -euo pipefail

          pkg_dir=dist
          mkdir -p ${pkg_dir}
          pkg_dir="$(readlink -f ${pkg_dir})"

          path="../setup.${{ inputs.client }}-client.py"

          echo "Building distribution package from ${path} to ${pkg_dir}"
          uv run --directory src python3 ${path} \
            bdist_wheel \
            --dist-dir ${pkg_dir}

          echo "Built package:"
          ls "${pkg_dir}"
      - name: Upload Distribution Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-package
          path: dist/
      - name: Retrieve Version
        id: version
        shell: uv run --no-project --with semver python {0}
        run: |
          import os
          import semver

          version_file = '${{ inputs.client }}_CLIENT_VERSION'.upper()

          with open(version_file) as f:
            from_version = f.read().strip()

          to_version = semver.Version.parse(from_version).bump_minor()

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'from-version={from_version}\n')
            f.write(f'to-version={to_version}\n')
            f.write(f'version-file={version_file}\n')
      - name: Update Version
        shell: bash
        run: |
          from_version=${{ steps.version.outputs.from-version }}
          to_version=${{ steps.version.outputs.to-version }}
          version_file=${{ steps.version.outputs.version-file }}

          echo "$to_version" > "$version_file"
          uv version --project "packages/${{ inputs.client }}-client" "$to_version"

          # Pin the exact version in pyproject.toml so downstream consumers get the correct version
          sed -i "s/\"${{ inputs.client }}-client.*\"/\"${{ inputs.client }}-client==${to_version}\"/" pyproject.toml

          git add "$version_file" "packages/${{ inputs.client }}-client/pyproject.toml" pyproject.toml uv.lock
          git commit -m "Upgrade ${{ inputs.client }} client" -m "from ${from_version} to ${to_version}"
          git push

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs:
      - build
    permissions:
      id-token: write
    steps:
      - name: Retrieve Distribution Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 # assumes package to be located in `dist/`
