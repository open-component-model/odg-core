name: Release Client Package
on:
  workflow_dispatch:
    inputs:
      client:
        type: choice
        options:
          - bdba
          - odg
      version:
        type: string
        required: false
        description: |
          Optional version to publish (e.g. 0.16.0).
          If not set, the latest PyPI version is bumped by minor.

concurrency:
  group: release-${{ inputs.client }}-client
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Python package
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify dispatch ref
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF_NAME" != "master" ]]; then
            echo "Error: this workflow must be dispatched from 'master', got: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.version }}" ]]; then
            uv version --project "packages/${{ inputs.client }}-client" --frozen "${{ inputs.version }}"
          else
            uv venv --no-project -q /tmp/pypi-resolve
            latest=$(uv pip install --no-deps --dry-run \
              --python /tmp/pypi-resolve/bin/python \
              "${{ inputs.client }}-client" \
              2>&1 | grep '^\s*+' | sed 's/.*==\(.*\)/\1/')
            uv version --project "packages/${{ inputs.client }}-client" --frozen "${latest}"
            uv version --project "packages/${{ inputs.client }}-client" --frozen --bump minor
          fi
      - name: Create distribution packages
        shell: bash
        run: |
          set -euo pipefail

          pkg_dir=dist
          mkdir -p ${pkg_dir}
          pkg_dir="$(readlink -f ${pkg_dir})"

          path="../setup.${{ inputs.client }}-client.py"

          echo "Building distribution package from ${path} to ${pkg_dir}"
          uv run --directory src python3 ${path} \
            bdist_wheel \
            --dist-dir ${pkg_dir}

          echo "Built package:"
          ls "${pkg_dir}"
      - name: Upload distribution package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-package
          path: dist/
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          wheel=$(ls dist/*.whl | head -1)
          echo "Testing wheel: ${wheel}"

          # derive top-level module names from the include patterns in pyproject.toml
          # patterns look like "bdba*", "delivery*" — strip the trailing glob
          modules=$(python3 -c "
          import tomllib
          with open('packages/${{ inputs.client }}-client/pyproject.toml', 'rb') as f:
              patterns = tomllib.load(f)['tool']['setuptools']['packages']['find']['include']
          print(' '.join(p.rstrip('*') for p in patterns))
          ")

          uv venv --no-project .venv-smoke-test
          uv pip install --python .venv-smoke-test/bin/python "${wheel}"
          .venv-smoke-test/bin/python -c "
          import importlib
          for mod in '${modules}'.split():
              importlib.import_module(mod)
              print(f'ok: {mod}')
          "

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    environment: release  # require approval to run
    needs:
      - build
    permissions:
      id-token: write
    steps:
      - name: Retrieve distribution package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-package
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 # assumes package to be located in `dist/`
