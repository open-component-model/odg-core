# the service account is always required: pods reference it by name at admission time, also
# in external-kubeconfig mode
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
---
{{- if or (not .Values.envVars) (not .Values.envVars.K8S_CFG_NAME) }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - delivery-gear.gardener.cloud
    resources:
      - backlogitems
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - delivery-gear.gardener.cloud
    resources:
      - logcollections
    verbs:
      - list
  - apiGroups:
      - delivery-gear.gardener.cloud
    resources:
      - runtimeartefacts
    verbs:
      - create
      - delete
      - list
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
roleRef:
  kind: Role
  name: delivery-service
  apiGroup: rbac.authorization.k8s.io
{{- end }}
