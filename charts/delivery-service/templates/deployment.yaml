{{- $podName := "delivery-service" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  {{- if default dict (.Values.deployment).annotations }}
  annotations:
  {{- range $annotation, $value := .Values.deployment.annotations }}
    {{ $annotation }}: {{ $value }}
  {{- end }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ $podName }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      {{- if default dict (.Values.pod).annotations }}
      annotations:
      {{- range $annotation, $value := .Values.pod.annotations }}
        {{ $annotation }}: {{ $value }}
      {{- end }}
      {{- end }}
      labels:
        app: {{ $podName }}
        {{- $dsNp := .Values.netpol | default dict }}
        # required once the database chart tightens its network policy
        # (primary.networkPolicy.allowExternal: false → only labelled client pods
        # in the database namespace are admitted); key matches the database
        # chart's fullname, override if release/chart name differ
        {{ $dsNp.dbClientLabelKey | default "delivery-db-client" }}: {{ $dsNp.dbClientLabelValue | default "true" | quote }}
      {{- if default dict (.Values.pod).labels }}
      {{- range $annotation, $value := .Values.pod.labels }}
        {{ $annotation }}: {{ $value }}
      {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ $podName }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $podName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: {{ $podName }}-migrate
          image: {{ include "image" .Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - migrations.bootstrap
          securityContext:
            allowPrivilegeEscalation: false
          env:
          - name: SECRET_FACTORY_PATH
            value: /secrets
          - name: K8S_TARGET_NAMESPACE
            value: {{ .Values.target_namespace | default .Release.Namespace }}
          # keep the migration log identity: OTEL_SERVICE_NAME from the main
          # container does not reach init containers
          - name: OTEL_SERVICE_NAME
            value: delivery-db-migration
          volumeMounts:
            - name: delivery-db
              mountPath: /secrets/delivery-db
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - app
            - --productive
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - containerPort: {{ default 5000 .Values.containerPort }}
              name: default
          env:
          - name: SECRET_FACTORY_PATH
            value: /secrets
          - name: EXTENSIONS_CFG_PATH
            value: /extensions_cfg/extensions_cfg
          - name: FINDINGS_CFG_PATH
            value: /findings_cfg/findings_cfg
          - name: FEATURES_CFG_PATH
            value: /features_cfg/features_cfg
          - name: OCM_REPO_MAPPINGS_PATH
            value: /ocm_repo_mappings/ocm_repo_mappings
          - name: PROFILES_PATH
            value: /profiles/profiles
          - name: SPRINTS_PATH
            value: /sprints/sprints
          - name: ADDRESSBOOK_PATH
            value: /addressbook/addressbook
          - name: GITHUB_MAPPINGS_PATH
            value: /github_mappings/github_mappings
          - name: K8S_TARGET_NAMESPACE
            value: {{ .Values.target_namespace | default .Release.Namespace }}
          # same semantics as odg.otelEnv in charts/extensions/templates/helpers.tpl
          # (this chart doesn't include that helper); unlike the extensions
          # umbrella chart (subcharts reach global.* automatically) a standalone
          # chart uses a plain value: the operator renders the ODG CR's
          # context.otlp_endpoint into `otlpEndpoint`, empty disables tracing
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ ternary (.Values.otlpEndpoint) (printf "http://telemetry-opentelemetry-collector.%s:4317" (.Values.target_namespace | default .Release.Namespace)) (hasKey .Values "otlpEndpoint") | quote }}
          - name: OTEL_SERVICE_NAME
            value: {{ .Chart.Name | quote }}
          - name: OTEL_SEMCONV_STABILITY_OPT_IN
            value: http
          # k8s identity via downward API for resource attrs (collector-side
          # k8sattributes pod_association misses outbound OTLP)
          - name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: K8S_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: K8S_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID),k8s.namespace.name=$(K8S_POD_NAMESPACE),k8s.container.name=delivery-service
          {{- if default dict .Values.envVars }}
          {{- range $key, $value := .Values.envVars }}
          - name: {{ $key }}
            value: {{ $value }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: delivery-db
              mountPath: /secrets/delivery-db
            - name: github
              mountPath: /secrets/github
            - name: github-app
              mountPath: /secrets/github-app
            - name: oauth-cfg
              mountPath: /secrets/oauth-cfg
            - name: oidc-cfg
              mountPath: /secrets/oidc-cfg
            - name: rbac
              mountPath: /secrets/rbac
            - name: oci-registry
              mountPath: /secrets/oci-registry
            - name: signing-cfg
              mountPath: /secrets/signing-cfg
            - name: extensions-cfg
              mountPath: /extensions_cfg
            - name: findings-cfg
              mountPath: /findings_cfg
            - name: ocm-repo-mappings
              mountPath: /ocm_repo_mappings
            - name: profiles
              mountPath: /profiles
            - name: features-cfg
              mountPath: "/features_cfg"
            - name: sprints
              mountPath: "/sprints"
            - name: addressbook
              mountPath: "/addressbook"
            - name: github-mappings
              mountPath: "/github_mappings"
          {{- with (.Values.deployment).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: delivery-db
          secret:
            secretName: {{ .Values.deliveryDb.secretName }}
        - name: github
          secret:
            secretName: secret-factory-github
            optional: true
        - name: github-app
          secret:
            secretName: secret-factory-github-app
            optional: true
        - name: oauth-cfg
          secret:
            secretName: secret-factory-oauth-cfg
            optional: true # authentication is optional
        - name: oidc-cfg
          secret:
            secretName: secret-factory-oidc-cfg
            optional: true # authentication is optional
        - name: rbac
          secret:
            secretName: secret-factory-rbac
            optional: true # authentication is optional
        - name: oci-registry
          secret:
            secretName: secret-factory-oci-registry
            optional: true # oci authentication is optional
        - name: signing-cfg
          secret:
            secretName: secret-factory-signing-cfg
            optional: true # authentication is optional
        - name: extensions-cfg
          configMap:
            name: extensions-cfg
        - name: findings-cfg
          configMap:
            name: findings-cfg
        - name: ocm-repo-mappings
          configMap:
            name: ocm-repo-mappings
        - name: profiles
          configMap:
            name: profiles
            optional: true
        - name: features-cfg
          secret:
            secretName: features-cfg
            optional: true
        - name: sprints
          configMap:
            name: sprints
            optional: true
        - name: addressbook
          configMap:
            name: addressbook
            optional: true
        - name: github-mappings
          configMap:
            name: github-mappings
            optional: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Egress
  egress:
    # cluster DNS — pod name resolution breaks without this
    - to:
        - namespaceSelector:
            matchLabels:
              {{- $np := .Values.netpol | default dict -}}
              {{- toYaml ($np.dnsNamespaceLabels | default (dict "kubernetes.io/metadata.name" "kube-system")) | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # delivery-database: in-cluster postgres pods by default (label pair is
    # stable across environments); external database hosts via netpol.postgresCidrs
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/component: primary
        {{- range $cidr := ($np.postgresCidrs | default (list)) }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    # HTTPS to arbitrary external endpoints (registries, APIs, CDNs)
    # cannot be narrowed by hostname without L7/DNS-aware egress filtering
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # Kubernetes API server: destination is the kubernetes.default ClusterIP:443
    # pre-DNAT but the translated endpoint IP:6443 post-DNAT; CNIs differ on
    # which side they enforce egress policy, so allow 6443 explicitly too
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-delivery-service
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Ingress
  ingress:
  - from:
    # workloads in the same namespace (extensions, dashboard)
    - podSelector: {}
    # ingress gateway namespaces (e.g. envoy-gateway-system on OpenShift); traffic
    # arrives via the Gateway/HTTPRoute. Not needed where the gateway data plane
    # runs in the same namespace (matched by the podSelector above) — matched via
    # the standard kubernetes.io/metadata.name label every namespace carries
    {{- range $gwNs := ($np.gatewayNamespaceNames | default (list "envoy-gateway-system")) }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $gwNs }}
    {{- end }}
    # kubelet probes arrive as host/node traffic and bypass pod network policy on
    # CNIs with host connectivity semantics (calico, cilium); probes remain healthy
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5000
