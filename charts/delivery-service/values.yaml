# image property will be set during release
image:
  ref: null
  repository: null
  tag: null
imagePullSecrets: []
deliveryDb:
  secretName: secret-factory-delivery-db
deployment:
  annotations: []
  resources:
    requests:
      memory: 2Gi
      cpu: 100m
    limits:
      memory: 12Gi
gateway:
  annotations: {}
  className: envoy-gateway
  enabled: false
# Tiered NetworkPolicy knobs (delivery-service chart). The shipped policies
# restrict egress to DNS, the Kubernetes API, the delivery database (5432) and
# HTTPS (443), and ingress to same-namespace pods plus listed gateway namespaces.
netpol:
  # labels selecting the cluster DNS namespace (default kube-system);
  # OpenShift example: {kubernetes.io/metadata.name: openshift-dns}
  dnsNamespaceLabels: {}
  # CIDRs of database hosts outside the cluster (port 5432). Without entries,
  # only the in-cluster postgres pods (label pair app.kubernetes.io/name=postgresql
  # + component=primary, stable across deployments) are reachable.
  postgresCidrs: []
  # namespaces allowed to ingress beyond same-namespace pods (matched via the
  # standard kubernetes.io/metadata.name label). Defaults to envoy-gateway's
  # conventional namespace; matches nothing where the gateway data plane runs
  # inside the release namespace (then the same-namespace rule covers it).
  gatewayNamespaceNames: []
  enableTls: true
  fullnameOverride: open-delivery-gear
host: delivery-service
limitRange:
  defaultRequest:
    memory: 250Mi
    cpu: 100m
  default:
    memory: 500Mi
