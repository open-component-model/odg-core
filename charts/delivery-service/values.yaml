# image property will be set during release
image:
  ref: null
  repository: null
  tag: null
deployment:
  annotations: []
  resources:
    requests:
      memory: 1Gi
      cpu: 100m
    limits:
      memory: 5Gi
      cpu: 500m
gateway:
  annotations: {}
  className: envoy-gateway
  enabled: false
  enableTls: true
  fullnameOverride: open-delivery-gear
host: delivery-service
