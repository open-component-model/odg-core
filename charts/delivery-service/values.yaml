# image property will be set during release
image:
  ref: null
  repository: null
  tag: null
imagePullSecrets: []
deliveryDb:
  secretName: secret-factory-delivery-db
deployment:
  annotations: []
  resources:
    requests:
      memory: 2Gi
      cpu: 100m
    limits:
      memory: 12Gi
gateway:
  annotations: {}
  className: envoy-gateway
  enabled: false
  enableTls: true
  fullnameOverride: open-delivery-gear
host: delivery-service
limitRange:
  defaultRequest:
    memory: 250Mi
    cpu: 100m
  default:
    memory: 500Mi
