{{- $podName := "backlog-controller" }}

{{- include "odg.rbac" . }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $podName }}
  template:
    metadata:
      labels:
        app: {{ $podName }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Chart.Name }}
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.global.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - backlog_controller
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: SECRET_FACTORY_PATH
              value: /secrets
            - name: EXTENSIONS_CFG_PATH
              value: /extensions_cfg/extensions_cfg
            - name: K8S_TARGET_NAMESPACE
              value: {{ .Values.target_namespace | default .Release.Namespace }}
            - name: ODG_LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" | quote }}
            {{- include "odg.otelEnv" . | nindent 12 }}
            {{- include "odg.otelResourceAttrs" . | nindent 12 }}
          volumeMounts:
            - name: extensions-cfg
              mountPath: /extensions_cfg
            - name: github
              mountPath: /secrets/github
            - name: github-app
              mountPath: /secrets/github-app
          {{- with (.Values.deployment).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: extensions-cfg
          configMap:
            name: extensions-cfg
        - name: github
          secret:
            secretName: secret-factory-github
            optional: true
        - name: github-app
          secret:
            secretName: secret-factory-github-app
            optional: true
---
{{- include "odg.netpol.egress" (list $podName . (dict "internet" true)) }}
