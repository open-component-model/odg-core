{{- $podName := "trivy" }}
{{- $cacheEnabled := (.Values.cache).enabled | default false }}
{{- $nodeSelector := (.Values.deployment).nodeSelector }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
  {{- if default dict (.Values.deployment).annotations }}
  annotations:
  {{- range $annotation, $value := .Values.deployment.annotations }}
    {{ $annotation }}: {{ $value }}
  {{- end }}
  {{- end }}
spec:
  replicas: 0 # will be scaled automatically by backlog-controller
  selector:
    matchLabels:
      app: {{ $podName }}
      delivery-gear.gardener.cloud/service: trivy
  template:
    metadata:
      labels:
        app: {{ $podName }}
        delivery-gear.gardener.cloud/service: trivy
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $podName }}
      terminationGracePeriodSeconds: 1800 # 30 min
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.global.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - trivy_extension
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: SECRET_FACTORY_PATH
              value: /secrets
            - name: EXTENSIONS_CFG_PATH
              value: /extensions_cfg/extensions_cfg
            - name: FINDINGS_CFG_PATH
              value: /findings_cfg/findings_cfg
            - name: OCM_REPO_MAPPINGS_PATH
              value: /ocm_repo_mappings/ocm_repo_mappings
            - name: K8S_TARGET_NAMESPACE
              value: {{ .Values.target_namespace | default .Release.Namespace }}
            {{- if $cacheEnabled }}
            - name: TRIVY_CACHE_DIR
              value: /cache/trivy
            {{- end }}
          volumeMounts:
            - name: aws
              mountPath: /secrets/aws
            - name: github
              mountPath: /secrets/github
            - name: github-app
              mountPath: /secrets/github-app
            - name: kubernetes
              mountPath: /secrets/kubernetes
            - name: oci-registry
              mountPath: /secrets/oci-registry
            {{- if $cacheEnabled }}
            - name: trivy-cache
              mountPath: /cache/trivy
            {{- end }}
            - name: extensions-cfg
              mountPath: /extensions_cfg
            - name: findings-cfg
              mountPath: /findings_cfg
            - name: ocm-repo-mappings
              mountPath: /ocm_repo_mappings
              readOnly: true
          lifecycle:
            preStop: # hook ensures that just created pods have at least enough time alive to add a termination signal handler
              exec:
                command:
                  - sleep
                  - "60"
          {{- with (.Values.deployment).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: aws
          secret:
            secretName: secret-factory-aws
            optional: true # aws client is optional
        - name: github
          secret:
            secretName: secret-factory-github
            optional: true
        - name: github-app
          secret:
            secretName: secret-factory-github-app
            optional: true
        - name: kubernetes
          secret:
            secretName: secret-factory-kubernetes
            optional: true # might use incluster config
        - name: oci-registry
          secret:
            secretName: secret-factory-oci-registry
            optional: true # oci authentication is optional
        {{- if $cacheEnabled }}
        - name: trivy-cache
          persistentVolumeClaim:
            claimName: trivy-cache
        {{- end }}
        - name: extensions-cfg
          configMap:
            name: extensions-cfg
        - name: findings-cfg
          configMap:
            name: findings-cfg
        - name: ocm-repo-mappings
          configMap:
            name: ocm-repo-mappings
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-from-trivy
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Egress
  egress:
    - {}  # Allows all egress traffic to any destination and port
{{- if $cacheEnabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-cache
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  accessModes:
    - {{ (.Values.cache).accessMode | default "ReadWriteMany" }}
  {{- if (.Values.cache).storageClass }}
  storageClassName: {{ .Values.cache.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ (.Values.cache).size | default "10Gi" }}
{{- end }}