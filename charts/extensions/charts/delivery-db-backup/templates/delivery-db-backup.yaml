{{- $podName := "delivery-db-backup" }}

{{- include "odg.rbac" . }}
---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  schedule: {{ default "0 0 * * *" .Values.schedule | quote }} # schedule contains asterisks, quote to avoid yaml parser errors
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ default 1 .Values.successful_jobs_history_limit }}
  failedJobsHistoryLimit: {{ default 1 .Values.failed_jobs_history_limit }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ default 43200 .Values.ttl_seconds_after_finished }} # 43200 -> 12h
      backoffLimit: {{ default 6 .Values.backoff_limit }}
      template:
        metadata:
          labels:
            app: {{ $podName }}
            {{- include "odg.labels.dbClient" . | nindent 12 }}
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ .Chart.Name }}
          containers:
          - name: {{ $podName }}
            image: {{ include "image" .Values.global.image }}
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - -m
            - delivery_db_backup
            securityContext:
              allowPrivilegeEscalation: false
            env:
            - name: SECRET_FACTORY_PATH
              value: /secrets
            - name: EXTENSIONS_CFG_PATH
              value: /extensions_cfg/extensions_cfg
            - name: K8S_TARGET_NAMESPACE
              value: {{ .Values.target_namespace | default .Release.Namespace }}
            - name: ODG_LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" | quote }}
            {{- include "odg.otelEnv" . | nindent 12 }}
            {{- include "odg.otelResourceAttrs" . | nindent 12 }}
            volumeMounts:
            - name: delivery-db
              mountPath: /secrets/delivery-db
            - name: github
              mountPath: /secrets/github
            - name: github-app
              mountPath: /secrets/github-app
            - name: oci-registry
              mountPath: /secrets/oci-registry
            - name: extensions-cfg
              mountPath: /extensions_cfg
            {{- with (.Values.cronjob).resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          volumes:
            - name: delivery-db
              secret:
                secretName: {{ .Values.deliveryDb.secretName }}
                defaultMode: 288 # octal 0440: owner+group read-only
            - name: github
              secret:
                secretName: secret-factory-github
                defaultMode: 288 # octal 0440: owner+group read-only
                optional: true
            - name: github-app
              secret:
                secretName: secret-factory-github-app
                defaultMode: 288 # octal 0440: owner+group read-only
                optional: true
            - name: oci-registry
              secret:
                secretName: secret-factory-oci-registry
                defaultMode: 288 # octal 0440: owner+group read-only
            - name: extensions-cfg
              configMap:
                name: extensions-cfg
          restartPolicy: Never
---
{{- include "odg.netpol.egress" (list $podName . (dict "postgres" true "internet" true)) }}
