{{- $podName := "freshclam" }}

{{- include "odg.serviceaccount" (dict "name" $podName "context" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $podName }}
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $podName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ $podName }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $podName }}
      securityContext:
        {{- include "odg.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ $podName }}
          image: {{ include "image" .Values.global.image }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - freshclam
          securityContext:
            {{- include "odg.containerSecurityContext" . | nindent 12 }}
          env:
            - name: ODG_LOG_LEVEL
              value: {{ .Values.logLevel | default "INFO" | quote }}
            {{- include "odg.otelEnv" (mergeOverwrite (deepCopy .) (dict "serviceName" "freshclam")) | nindent 12 }}
            {{- include "odg.otelResourceAttrs" (mergeOverwrite (deepCopy .) (dict "containerName" "freshclam")) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readiness
              port: 8080
            failureThreshold: 12
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: www
              mountPath: /www
            - name: freshclam-status
              mountPath: /freshclam
          ports:
            - containerPort: 8080
              name: default
          {{- with (.Values.freshclam).resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: www
          emptyDir: {}
        - name: freshclam-status
          emptyDir: {}
---
{{- include "odg.netpol.egress" (list $podName . (dict "internet" true "anywherePorts" (list 80))) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-freshclam
  namespace: {{ .Values.target_namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $podName }}
  policyTypes:
    - Ingress
  ingress:
  - from:
    # only the clamd pods pull whole-database files from this private mirror;
    # kubelet probes arrive as host/node traffic and bypass pod network policy
    - podSelector:
        matchLabels:
          app: clamav
    ports:
    - protocol: TCP
      port: 8080
