global:
  # image property will be set during release
  image:
    ref: null
    repository: null
    tag: null
  imagePullSecrets: []
  # Tiered egress NetworkPolicy knobs, shared by all extensions via
  # odg.netpol.egress (charts/extensions/templates/helpers.tpl). Egress is
  # restricted to DNS, the delivery-service API (in-cluster), the delivery
  # database (5432, DB-consumers only) and HTTPS (443, everywhere).
  netpol:
    # labels selecting the cluster DNS namespace (default kube-system);
    # OpenShift example: {kubernetes.io/metadata.name: openshift-dns}
    dnsNamespaceLabels: {}
    # CIDRs of database hosts outside the cluster (port 5432). Without entries,
    # only the in-cluster postgres pods (label pair app.kubernetes.io/name=postgresql
    # + component=primary, stable across deployments) are reachable.
    postgresCidrs: []
    # client label rendered onto DB-consuming pods, required once the database
    # chart's network policy runs with primary.networkPolicy.allowExternal=false
    # (upstream then admits only <fullname>-client=true pods in its namespace).
    # NOTE: when the database chart is rendered without fullnameOverride (e.g.
    # odg-operator's default helm template name), the upstream client's label
    # key becomes `release-name-postgresql-client` — set it here accordingly.
    dbClientLabelKey: "delivery-db-client"
    dbClientLabelValue: "true"
    # pod labels selecting the in-namespace OpenTelemetry collector as an egress
    # target for trace/metric export (TCP 4317+4318); a selector that matches
    # nothing is harmless.
    otlpCollectorLabels:
      app.kubernetes.io/name: opentelemetry-collector

# OTLP gRPC endpoint for trace export. Resolution order in odg.otelEnv
# (charts/extensions/templates/helpers.tpl) — key semantics depend on the
# key's PRESENCE, not its value:
#   key present, non-empty → exported to that collector
#   key present, empty ""  → tracing disabled (explicit opt-out)
#   key absent            → derived from target_namespace, exposing ODG
#                         workloads' traces to the collector shipped with
#                         the telemetry extension (or to nothing — pods
#                         resolve via namespace-local DNS and the export
#                         just times out when the collector is not there,
#                         with batch-processor back-pressure, so DNS
#                         failures are visible but not harmful)
# Set per extension release via the ODG CR's spec.context.otlp_endpoint
# (not under `global:` — each extension is its own release).
# otlpEndpoint: ""

access-manager:
  cronjob:
    resources:
      requests:
        memory: 250Mi
        cpu: 100m
      limits:
        memory: 500Mi
  deliveryDb:
    secretName: secret-factory-delivery-db
  enabled: false
  rbac:
    rules: # pushes logs into logcollections CRDs only
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
artefact-enumerator:
  cronjob:
    resources:
      requests:
        memory: 200Mi
        cpu: 250m
      limits:
        memory: 1Gi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [create, get, patch] # create; on conflict reload (get) + bump priority (patch)
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [runtimeartefacts]
        verbs: [list]
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
backlog-controller:
  deployment:
    resources:
      requests:
        memory: 100Mi
        cpu: 250m
      limits:
        memory: 250Mi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [list, update, watch] # list+watch stream; update=remove claim (replace)
      - apiGroups: [""]
        resources: [pods]
        verbs: [list] # find dead claimants
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [get, update] # read + scale replicas (replace)
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
