global:
  # image property will be set during release
  image:
    ref: null
    repository: null
    tag: null
  imagePullSecrets: []

access-manager:
  cronjob:
    resources:
      requests:
        memory: 250Mi
        cpu: 100m
      limits:
        memory: 500Mi
  deliveryDb:
    secretName: secret-factory-delivery-db
  enabled: false
  rbac:
    rules: # pushes logs into logcollections CRDs only
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
artefact-enumerator:
  cronjob:
    resources:
      requests:
        memory: 200Mi
        cpu: 250m
      limits:
        memory: 1Gi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [create, get, patch] # create; on conflict reload (get) + bump priority (patch)
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [runtimeartefacts]
        verbs: [list]
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
backlog-controller:
  deployment:
    resources:
      requests:
        memory: 100Mi
        cpu: 250m
      limits:
        memory: 250Mi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [list, update, watch] # list+watch stream; update=remove claim (replace)
      - apiGroups: [""]
        resources: [pods]
        verbs: [list] # find dead claimants
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [get, update] # read + scale replicas (replace)
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
bdba:
  deployment:
    annotations: []
    resources:
      requests:
        memory: 500Mi
        cpu: 250m
      limits:
        memory: 1Gi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [list, update, delete] # list+claim (update=replace); delete after processing
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
