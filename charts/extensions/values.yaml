  enabled: false
  schedule: null
  target_namespace: null
  rbac:
    rules: # pushes logs into logcollections CRDs only
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
  ttl_seconds_after_finished: null
  successful_jobs_history_limit: null
  failed_jobs_history_limit: null
  backoff_limit: null
trivy:
  deployment:
    annotations: []
    nodeSelector: {} # to pin trivy pods to selected node(s)
    resources:
      requests:
        memory: 500Mi
        cpu: 250m
      limits:
        memory: 1Gi
  enabled: false
  rbac:
    rules:
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [backlogitems]
        verbs: [list, update, delete]
      - apiGroups: [delivery-gear.gardener.cloud]
        resources: [logcollections]
        verbs: [create, get, update]
  cache:
    enabled: false
    storageClass: "" # if empty default SC is used
    size: 10Gi
    accessMode: ReadWriteMany # use RWO when pinned to a single node
