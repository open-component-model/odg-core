      provider: ""
      sources: []
      componentReferences: []
      resources:
        - name: my-image
          version: 1.0.0
          type: ociImage
          relation: local
          access:
            type: ociRegistry
            imageReference: registry.example.com/my-image:1.0.0
          labels: []
          extraIdentity: {}
        - name: my-image-sbom
          version: 1.0.0
          type: sbom
          relation: local
          access:
            type: ociRegistry
            imageReference: registry.example.com/my-image-sbom:1.0.0
