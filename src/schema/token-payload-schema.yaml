description: Delivery Service JWT schema
type: object
required:
  - version
  - sub
  - iss
  - iat
  - key_id
  - roles
properties:
  version:
    type: string
  sub:
    type: string
  iss:
    type: string
  iat:
    type: integer
  exp:
    type: integer
  key_id:
    type: string
  roles:
    type: array
    items:
      type: string
