[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os

# template used to generate migration file names
# second-precision UTC timestamp keeps files chronologically sortable
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d-%%(rev)s_%%(slug)s
timezone = UTC

# database URL. Overridden by migrations/env.py via CLI argument, DELIVERY_DB_URL env var,
# or SECRET_FACTORY_PATH (see env.py).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix --silent REVISION_SCRIPT_FILENAME

# this console setup only takes effect in standalone `alembic` CLI runs: env.py
# skips fileConfig when the root logger already has handlers (configure_logging in the
# bootstrap init-container) so it cannot shadow the structlog pipeline there
[loggers]
keys = root,sqlalchemy,alembic,odg_migrations

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_odg_migrations]
level = INFO
handlers =
qualname = odg.migrations

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
